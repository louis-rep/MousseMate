[build]
builder = "nixpacks"

[deploy]
# --no-sync: use the venv baked into the image; a plain `uv run` re-installs dev deps at boot
startCommand = "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
# must cover migrations at boot; 30s killed the container mid-migration
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
