[build]
builder = "nixpacks"

[deploy]
# Boot (migrations + uvicorn) lives in start.sh, the image CMD. Do NOT set
# startCommand here: railway execs it without a shell, so `a && b` chains
# silently run only `a` and exit — the deploy "completes" with no server.
healthcheckPath = "/health"
# must cover migrations at boot (normal boot ~15s); short enough to fail fast
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
